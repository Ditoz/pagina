<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Bustime</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenido a Bustime</h1>
        <p>Control de buses en Chía - Selecciona tu bus</p>
    </header>

    <section id="bus">
        <h2>Selecciona el tipo de bus</h2>
        <div id="img/bus2.png">
            <img src="img/bus2.png" alt="Imagen de bus" />
        </div>
        <form action="#" method="POST">
            <label for="tipo_bus">Elige un tipo de bus:</label>
            <select id="tipo_bus" name="tipo_bus">
                <option value="transchia">TransChía</option>
                <option value="flotachia">FlotaChía</option>
            </select>
            <button type="submit">Seleccionar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Bustime - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
